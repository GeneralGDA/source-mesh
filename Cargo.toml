
[workspace]
members = ["crates/source-mesh", "crates/source-mesh-core"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/GeneralGDA/source-mesh"
keywords = ["rust", "dependency-graph", "architecture", "dependencies", "diagram"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1.0.104"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std", "config"] }
bon = "3.10.3"
clap = { version = "4.6.7", features = ["derive"] }
colorous = "1.0.16"
dunce = "1.0.5"
derive-new = "0.7"
getset = "0.1.7"
graphviz-rust = { version = "0.9.9", default-features = false }
quick-xml = "0.42.0"
scip = "0.10"
protobuf = "3.7.2"
path-clean = "1.0.1"
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
same-file = "1.0.6"
serde_json = "1.0.154"
tempfile = "3.27.0"
typed-path = "0.13.0"
lsp-server = "0.10.0"
url = "2.5.8"
claims = "0.8.0"
pretty_assertions = "1.4.1"
roxmltree = "0.21.2"
rstest = { version = "0.28", default-features = false }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

derive_partial_eq_without_eq = "allow"
missing_errors_doc = "allow"
redundant_pub_crate = "allow"
redundant_test_prefix = "allow"
too_many_lines = "allow"
unnecessary_wraps = "allow"

allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_pointer_underscore = "deny"
as_underscore = "deny"
cfg_not_test = "deny"
clone_on_ref_ptr = "deny"
create_dir = "deny"
else_if_without_else = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
exit = "deny"
expect_used = "deny"
field_scoped_visibility_modifiers = "deny"
filetype_is_file = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
host_endian_bytes = "deny"
if_then_some_else_none = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
integer_division = "deny"
iter_over_hash_type = "deny"
let_underscore_untyped = "deny"
lossy_float_literal = "deny"
map_with_unused_argument_over_ranges = "deny"
missing_asserts_for_indexing = "deny"
mixed_read_write_in_expression = "deny"
module_name_repetitions = "deny"
multiple_inherent_impl = "deny"
needless_raw_strings = "deny"
negative_feature_names = "deny"
non_ascii_literal = "deny"
non_zero_suggestions = "deny"
panic_in_result_fn = "deny"
partial_pub_fields = "deny"
pathbuf_init_then_push = "deny"
pattern_type_mismatch = "deny"
pointer_format = "deny"
precedence_bits = "deny"
pub_without_shorthand = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_feature_names = "deny"

rest_pat_in_fully_bound_structs = "deny"
return_and_then = "deny"
same_name_method = "deny"
self_named_module_files = "deny"
shadow_unrelated = "deny"
str_to_string = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
tests_outside_test_module = "deny"
todo = "deny"
try_err = "deny"
unimplemented = "deny"
unnecessary_self_imports = "deny"
unseparated_literal_suffix = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"
wildcard_dependencies = "deny"
wildcard_enum_match_arm = "deny"
